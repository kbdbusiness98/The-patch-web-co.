<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>The Patch Web Co. | Local Websites for Local Businesses</title>

  <meta
    name="description"
    content="Affordable, modern websites for local businesses. The Patch Web Co. builds clean, mobile-friendly websites without agency pricing or confusing tech."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Nunito:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --soil: #1c2730;
      --bark: #3a4e5a;
      --moss: #3a5a72;
      --sage: #7aaabb;
      --cream: #e8f0f5;
      --parchment: #f4f6f8;
      --amber: #c47b2b;
      --sky: #b8d4e2;

      --radius: 20px;
      --transition: 0.25s ease;
      --shadow: 0 12px 32px rgba(28, 39, 48, 0.08);
      --max-width: 1140px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Nunito", sans-serif;
      background: var(--parchment);
      color: var(--soil);
      line-height: 1.6;
      overflow-x: hidden;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    section {
      padding: 6rem 1.5rem;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    /* ======================
       NAVIGATION
    ====================== */

    .navbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;

      background: rgba(244, 246, 248, 0.92);
      backdrop-filter: blur(10px);

      border-bottom: 1px solid rgba(58, 90, 114, 0.12);
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 1rem 1.5rem;
    }

    .logo {
      font-family: "Lora", serif;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .logo span {
      color: var(--moss);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--bark);
      transition: color var(--transition);
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--moss);
    }

    /* ======================
       HERO
    ====================== */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          ellipse at top right,
          rgba(58, 90, 114, 0.1),
          transparent 50%
        ),
        radial-gradient(
          ellipse at bottom left,
          rgba(184, 212, 226, 0.25),
          transparent 55%
        );

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 780px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.78rem;
      color: var(--moss);
      margin-bottom: 1rem;
      font-weight: 700;
    }

    h1 {
      font-family: "Lora", serif;
      font-size: clamp(3rem, 7vw, 5.8rem);
      line-height: 1.05;
      margin-bottom: 1.5rem;
    }

    h1 em {
      font-style: italic;
      color: var(--moss);
    }

    .hero-text {
      max-width: 560px;
      font-size: 1.1rem;
      color: var(--bark);
      margin-bottom: 2rem;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 50px;

      padding: 0 2rem;

      border-radius: 999px;

      font-size: 0.88rem;
      font-weight: 700;

      letter-spacing: 0.08em;
      text-transform: uppercase;

      transition:
        background var(--transition),
        color var(--transition),
        border-color var(--transition),
        transform var(--transition);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--moss);
      color: white;
      border: 2px solid var(--moss);
    }

    .btn-primary:hover {
      background: var(--soil);
      border-color: var(--soil);
    }

    .btn-secondary {
      border: 2px solid var(--bark);
      color: var(--soil);
    }

    .btn-secondary:hover {
      background: var(--bark);
      color: white;
    }

    /* ======================
       SECTIONS
    ====================== */

    .section-label {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.75rem;
      color: var(--moss);
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    .section-title {
      font-family: "Lora", serif;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
      margin-bottom: 3rem;
    }

    .section-title.accent {
      color: var(--sage);
    }

    /* ======================
       ABOUT
    ====================== */

    .about {
      background: var(--bark);
      color: var(--sky);
      border-radius: var(--radius);

      margin: 0 1.5rem;

      padding: 4rem 2rem;
    }

    .about-grid {
      max-width: var(--max-width);
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 3rem;
    }

    .about h2 {
      font-family: "Lora", serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.2;
    }

    .about h2 em {
      color: white;
      font-style: italic;
    }

    .about p {
      font-size: 1rem;
      line-height: 1.9;
    }

    /* ======================
       CARDS
    ====================== */

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--cream);
      border-radius: var(--radius);
      padding: 2rem;

      border: 1px solid rgba(58, 90, 114, 0.12);

      transition:
        transform var(--transition),
        box-shadow var(--transition);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .card-number {
      font-family: "Playfair Display", serif;
      font-size: 3rem;
      color: rgba(58, 90, 114, 0.18);
      margin-bottom: 1rem;
    }

    .card h3 {
      font-family: "Lora", serif;
      margin-bottom: 0.75rem;
      font-size: 1.3rem;
    }

    .card p {
      color: var(--bark);
      margin-bottom: 1.5rem;
    }

    .price {
      border-top: 1px solid rgba(58, 90, 114, 0.15);
      padding-top: 1rem;

      font-size: 0.85rem;
      font-weight: 700;
      color: var(--amber);
    }

    /* ======================
       CONTACT FORM
    ====================== */

    .contact {
      text-align: center;
      max-width: 760px;
      margin: 0 auto;
    }

    .contact-sub {
      margin-bottom: 2rem;
      color: var(--bark);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    input,
    select,
    textarea {
      width: 100%;

      padding: 1rem 1.2rem;

      border-radius: 16px;

      border: 1px solid rgba(58, 90, 114, 0.2);

      background: white;

      font: inherit;

      transition: border-color var(--transition);
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--moss);
    }

    button {
      cursor: pointer;
    }

    /* ======================
       FOOTER
    ====================== */

    footer {
      background: var(--bark);
      color: rgba(255,255,255,0.7);

      text-align: center;

      padding: 2rem 1.5rem;
      margin-top: 4rem;
    }

    footer span {
      color: var(--sage);
    }

    /* ======================
       ACCESSIBILITY
    ====================== */

    :focus-visible {
      outline: 3px solid var(--sage);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

    /* ======================
       MOBILE
    ====================== */

    @media (max-width: 768px) {
      .nav-links {
        gap: 1rem;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      section {
        padding: 5rem 1.25rem;
      }

      .hero {
        padding-top: 4rem;
      }
    }

    @media (max-width: 560px) {
      .nav-links {
        display: none;
      }

      .button-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="nav-inner">

      <a href="#" class="logo" aria-label="The Patch Web Co Home">
        The <span>Patch Web</span> Co.
      </a>

      <nav aria-label="Primary Navigation">
        <ul class="nav-links">
          <li><a href="#services">Services</a></li>
          <li><a href="#process">Process</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <main>

    <section class="hero">
      <div class="container hero-content">

        <p class="eyebrow">
          Local Websites for Local Businesses
        </p>

        <h1>
          Your business deserves a
          <em>proper</em> website.
        </h1>

        <p class="hero-text">
          The Patch Web Co. builds modern, affordable websites for small businesses without agency pricing or confusing tech.
        </p>

        <div class="button-group">
          <a href="#contact" class="btn btn-primary">
            Get a Free Quote
          </a>

          <a href="#services" class="btn btn-secondary">
            View Services
          </a>
        </div>

      </div>
    </section>

  </main>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }
      });
    }, {
      threshold: 0.15
    });

    document.querySelectorAll(".card").forEach((card) => {
      observer.observe(card);
    });

    const form = document.querySelector("form");

    form?.addEventListener("submit", (e) => {
      e.preventDefault();

      const button = form.querySelector("button");

      button.textContent = "Message Sent ✓";
      button.disabled = true;
    });
  </script>

</body>
</html>
